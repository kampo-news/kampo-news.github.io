name: Scheduled News Crawler & Updater

on:
  schedule:
    # UTC時刻で指定（JST = UTC + 9時間）
    - cron: '0 21 * * *'  # JST 06:00 (朝のニュースまとめ & メール通知)
    - cron: '0 0 * * *'   # JST 09:00 (午前の巡回)
    - cron: '0 3 * * *'   # JST 12:00 (昼のニュースまとめ & メール通知)
    - cron: '0 6 * * *'   # JST 15:00 (午後の巡回)
    - cron: '0 9 * * *'   # JST 18:00 (夕方のニュースまとめ & メール通知)
  workflow_dispatch:      # GitHub画面から手動でいつでも実行可能

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Crawler & AI Processing
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/run_job.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update articles.json [skip ci]"
            git push
          else
            echo "No changes in articles.json to commit."
          fi
